<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Calendar — 2‑Week Time Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <style>
    :root{--bg:#f7fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--ring:#6366f1;--border:#e2e8f0;--chip:#eef2ff}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(#fafafa,#fff)}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px}
    h1{font-size:20px;margin:0;color:var(--ink)}
    .btn{border:1px solid var(--border);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer}
    .btn:focus{outline:2px solid var(--ring)}
    .btn.icon{display:inline-grid;place-items:center;padding:8px;width:36px;height:36px}
    .wrap{max-width:1200px;margin:0 auto;padding:0 16px 24px}
    .tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin:0 16px}
    .tab{padding:10px 12px;border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;background:#fff;cursor:pointer}
    .tab[aria-selected="true"]{background:var(--chip)}
    .panel{border:1px solid var(--border);border-radius:16px;padding:16px;background:#fff;margin:0 16px}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
    .range{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
    .day{min-height:160px;border:1px solid var(--border);border-radius:16px;padding:10px;background:#fff;display:flex;flex-direction:column}
    .day.today{outline:2px solid var(--ring)}
    .daytop{display:flex;align-items:baseline;justify-content:space-between}
    .muted{color:var(--muted)}
    .list{margin-top:8px;display:flex;flex-direction:column;gap:6px;overflow:auto}
    .entry{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:8px}
    .dot{width:10px;height:10px;border-radius:999px;flex:0 0 10px;border:1px solid #0002}
    .grow{flex:1}
    .small{font-size:12px}
    .projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
    input,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px}
    .row{display:flex;gap:10px;align-items:end}
    .row>*{flex:1}
    .tag{display:inline-flex;gap:8px;align-items:center}
    .chip{background:var(--chip);border-radius:999px;padding:2px 8px}
    .right{margin-left:auto}
    .footer{display:flex;gap:8px;justify-content:flex-end}
    .hidden{display:none}
  </style>
</head>
<body>
  <header>
    <h1>📅 Smart Calendar — 2‑Week Time Tracker (Vanilla)</h1>
    <div>
      <button class="btn" id="btnExport">Export JSON</button>
      <label class="btn" for="importFile">Import JSON</label>
      <input id="importFile" type="file" accept="application/json" class="hidden" />
    </div>
  </header>

  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabCal" aria-selected="true">Calendar</button>
      <button class="tab" role="tab" id="tabTotals" aria-selected="false">Totals</button>
      <button class="tab" role="tab" id="tabProj" aria-selected="false">Projects</button>
    </div>

    <!-- Calendar Panel -->
    <section id="panelCal" class="panel" role="tabpanel" aria-labelledby="tabCal">
      <div class="toolbar">
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn icon" id="prev">◀</button>
          <button class="btn icon" id="next">▶</button>
          <button class="btn" id="btnToday">This ISO Week</button>
          <span class="muted" id="rangeText"></span>
        </div>
        <button class="btn" id="addEntryOpen">Add Entry</button>
      </div>
      <div class="grid" id="calGrid"></div>
    </section>

    <!-- Totals Panel -->
    <section id="panelTotals" class="panel hidden" role="tabpanel" aria-labelledby="tabTotals">
      <div class="row">
        <div>
          <label>Start</label>
          <input type="date" id="totStart" />
        </div>
        <div>
          <label>End</label>
          <input type="date" id="totEnd" />
        </div>
        <div style="text-align:right">
          <div class="muted small">Total</div>
          <div id="totOverall" style="font-weight:600;font-size:20px">0 h</div>
        </div>
      </div>
      <div id="totList" style="margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px"></div>
    </section>

    <!-- Projects Panel -->
    <section id="panelProj" class="panel hidden" role="tabpanel" aria-labelledby="tabProj">
      <div class="row">
        <div>
          <label>Project name</label>
          <input id="projName" placeholder="e.g., Titan FW" />
        </div>
        <div style="flex:0 0 120px">
          <label>Color</label>
          <input id="projColor" type="color" value="#22c55e" />
        </div>
        <div style="flex:0 0 140px">
          <button class="btn" id="projAdd">Add Project</button>
        </div>
      </div>
      <div class="projects" id="projList" style="margin-top:12px"></div>
    </section>
  </div>

  <!-- Add/Edit Entry Modal (very small vanilla modal) -->
  <dialog id="entryDialog" style="border:none;border-radius:16px;padding:16px;max-width:420px;width:90vw">
    <h3 style="margin:0 0 8px">Add Time Entry</h3>
    <div class="row">
      <div>
        <label>Date</label>
        <input type="date" id="dlgDate" />
      </div>
      <div>
        <label>Hours</label>
        <input type="number" id="dlgHours" min="0" step="0.25" value="1" />
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <div>
        <label>Project</label>
        <select id="dlgProject"></select>
      </div>
    </div>
    <div style="margin-top:8px">
      <label>Note (optional)</label>
      <input id="dlgNote" placeholder="e.g., PR review" />
    </div>
    <div class="footer" style="margin-top:12px">
      <button class="btn" id="dlgCancel">Cancel</button>
      <button class="btn" id="dlgSave">Save</button>
    </div>
  </dialog>

  <script>
  // ===== Data Types & Storage =====
  const STORAGE_KEY = 'smart-calendar-vanilla-v1';
  /** @type {{projects: {id:string,name:string,color:string}[], entries: {id:string,date:string,projectId:string,hours:number,note?:string}[]}} */
  let db = loadDB();

  function loadDB(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return seed();
      const parsed = JSON.parse(raw);
      if(!parsed.projects || !parsed.entries) throw new Error('bad');
      return parsed;
    }catch(e){return seed();}
  }
  function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  function uid(p='id'){ return p + '_' + Math.random().toString(36).slice(2,10); }

  function seed(){
    const today = new Date();
    return {
      projects:[
        {id:'p1', name:'Titan FW', color:'#22c55e'},
        {id:'p2', name:'QA Automation', color:'#3b82f6'},
        {id:'p3', name:'Baby Tracker', color:'#f97316'},
      ],
      entries:[
        {id:uid('e'), date:fmtYMD(addDays(today,-1)), projectId:'p1', hours:2.5, note:'PR review'},
        {id:uid('e'), date:fmtYMD(addDays(today,-1)), projectId:'p2', hours:1.5, note:'Playwright tests'},
        {id:uid('e'), date:fmtYMD(today), projectId:'p3', hours:0.75, note:'UI polish'},
      ]
    }
  }

  // ===== Date Helpers (ISO week) =====
  function startOfISOWeek(d){
    const x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = x.getUTCDay();
    const diff = (day===0?-6:1) - day; // Monday=1
    x.setUTCDate(x.getUTCDate()+diff);
    return x;
  }
  function addDays(d,n){ const x=new Date(d); x.setUTCDate(x.getUTCDate()+n); return x; }
  function fmtYMD(d){ return d.toISOString().slice(0,10); }
  function parseYMD(s){ const [y,m,da]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,da)); }
  function humanDate(d){ return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}); }

  // ===== State & Elements =====
  let anchor = startOfISOWeek(new Date());
  const calGrid = document.getElementById('calGrid');
  const rangeText = document.getElementById('rangeText');
  const btnPrev = document.getElementById('prev');
  const btnNext = document.getElementById('next');
  const btnToday = document.getElementById('btnToday');
  const addEntryOpen = document.getElementById('addEntryOpen');
  const entryDialog = document.getElementById('entryDialog');
  const dlgDate = document.getElementById('dlgDate');
  const dlgHours = document.getElementById('dlgHours');
  const dlgProject = document.getElementById('dlgProject');
  const dlgNote = document.getElementById('dlgNote');
  const dlgCancel = document.getElementById('dlgCancel');
  const dlgSave = document.getElementById('dlgSave');

  // Tabs
  const tabCal = document.getElementById('tabCal');
  const tabTotals = document.getElementById('tabTotals');
  const tabProj = document.getElementById('tabProj');
  const panelCal = document.getElementById('panelCal');
  const panelTotals = document.getElementById('panelTotals');
  const panelProj = document.getElementById('panelProj');

  function showPanel(which){
    const map = {cal:[panelCal, tabCal], totals:[panelTotals, tabTotals], proj:[panelProj, tabProj]};
    for(const [k,[p,t]] of Object.entries(map)){
      const sel = (k===which);
      p.classList.toggle('hidden', !sel);
      t.setAttribute('aria-selected', sel?'true':'false');
    }
  }
  tabCal.onclick = ()=> showPanel('cal');
  tabTotals.onclick = ()=> { showPanel('totals'); renderTotals(); };
  tabProj.onclick = ()=> { showPanel('proj'); renderProjects(); };

  // ===== Calendar Rendering =====
  function entriesByDate(){
    const m = {};
    for(const e of db.entries){ (m[e.date] ||= []).push(e); }
    return m;
  }
  function projectById(){ const m={}; for(const p of db.projects){ m[p.id]=p; } return m; }
  function sumHours(list){ return Number(list.reduce((a,b)=>a+(b.hours||0),0).toFixed(2)); }

  function twoWeek(){
    const start = startOfISOWeek(anchor);
    return Array.from({length:14},(_,i)=> addDays(start,i));
  }

  function renderCalendar(){
    const days = twoWeek();
    rangeText.textContent = humanDate(days[0]) + ' – ' + humanDate(days[13]);
    const map = entriesByDate();
    const pmap = projectById();
    const todayYMD = fmtYMD(new Date());

    calGrid.innerHTML = '';
    for(const d of days){
      const ymd = fmtYMD(d);
      const list = map[ymd] || [];
      const total = sumHours(list);
      const dayEl = document.createElement('div');
      dayEl.className = 'day' + (ymd===todayYMD? ' today':'');
      dayEl.innerHTML = `
        <div class="daytop"><div><strong>${humanDate(d)}</strong></div><div class="muted small">${total>0? total+'h':''}</div></div>
        <div class="list"></div>
        <div style="margin-top:auto">
          <button class="btn" data-add="${ymd}">Add Entry</button>
        </div>
      `;
      const listEl = dayEl.querySelector('.list');
      if(list.length===0){
        const empty = document.createElement('div'); empty.className='small muted'; empty.textContent='No entries'; listEl.appendChild(empty);
      } else {
        for(const e of list){
          const row = document.createElement('div');
          row.className='entry';
          row.innerHTML = `
            <span class="dot" style="background:${pmap[e.projectId]?.color||'#94a3b8'}"></span>
            <div class="grow">
              <div class="small"><strong>${pmap[e.projectId]?.name||'Unknown'}</strong> · ${e.hours}h</div>
              ${e.note? `<div class="small muted">${escapeHtml(e.note)}</div>`:''}
            </div>
            <button class="btn small" data-del="${e.id}">🗑</button>
          `;
          listEl.appendChild(row);
        }
      }
      calGrid.appendChild(dayEl);
    }

    // Wire up per-day Add & delete buttons
    calGrid.querySelectorAll('[data-add]').forEach(btn=>{
      btn.addEventListener('click', ()=> openDialog(btn.getAttribute('data-add')));
    });
    calGrid.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=> { delEntry(btn.getAttribute('data-del')); renderCalendar(); });
    });
  }

  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

  // ===== Entry Dialog =====
  function openDialog(dateStr){
    dlgDate.value = dateStr || fmtYMD(new Date());
    dlgHours.value = '1';
    dlgNote.value = '';
    // populate projects
    dlgProject.innerHTML = '';
    for(const p of db.projects){ const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; dlgProject.appendChild(o); }
    entryDialog.showModal();
  }
  dlgCancel.onclick = ()=> entryDialog.close();
  dlgSave.onclick = ()=>{
    const date = dlgDate.value; const hours = Math.max(0, Number(dlgHours.value||0)); const pid = dlgProject.value; const note = dlgNote.value.trim();
    if(!date || !pid || !Number.isFinite(hours)) return;
    db.entries.push({ id:uid('e'), date, projectId:pid, hours:Number(hours.toFixed(2)), note: note||undefined });
    saveDB(); entryDialog.close(); renderCalendar();
  };

  addEntryOpen.onclick = ()=> openDialog(fmtYMD(new Date()));
  btnPrev.onclick = ()=> { anchor = addDays(startOfISOWeek(anchor), -14); renderCalendar(); };
  btnNext.onclick = ()=> { anchor = addDays(startOfISOWeek(anchor), 14); renderCalendar(); };
  btnToday.onclick = ()=> { anchor = startOfISOWeek(new Date()); renderCalendar(); };

  function delEntry(id){ db.entries = db.entries.filter(e=> e.id!==id); saveDB(); }

  // ===== Totals =====
  const totStart = document.getElementById('totStart');
  const totEnd = document.getElementById('totEnd');
  const totOverall = document.getElementById('totOverall');
  const totList = document.getElementById('totList');

  function renderTotals(){
    if(!totStart.value) totStart.value = fmtYMD(addDays(new Date(), -13));
    if(!totEnd.value) totEnd.value = fmtYMD(new Date());
    const s = parseYMD(totStart.value); const e = parseYMD(totEnd.value); e.setUTCDate(e.getUTCDate()+1);
    const inRange = db.entries.filter(x=> { const d=parseYMD(x.date); return d>=s && d<e; });
    const byProject = new Map();
    for(const x of inRange){ byProject.set(x.projectId, (byProject.get(x.projectId)||0)+x.hours); }
    const total = Number(inRange.reduce((a,b)=>a+b.hours,0).toFixed(2));
    totOverall.textContent = total + ' h';

    const pmap = projectById();
    totList.innerHTML = '';
    for(const [pid,hours] of byProject){
      const card = document.createElement('div');
      card.className = 'day';
      card.innerHTML = `
        <div class="tag"><span class="dot" style="background:${pmap[pid]?.color||'#94a3b8'}"></span><strong>${pmap[pid]?.name||pid}</strong></div>
        <div class="right" style="font-size:18px;font-weight:600">${hours.toFixed(2)} h</div>
      `;
      totList.appendChild(card);
    }
  }
  totStart.addEventListener('change', renderTotals);
  totEnd.addEventListener('change', renderTotals);

  // ===== Projects =====
  const projName = document.getElementById('projName');
  const projColor = document.getElementById('projColor');
  const projAdd = document.getElementById('projAdd');
  const projList = document.getElementById('projList');

  function renderProjects(){
    projList.innerHTML = '';
    for(const p of db.projects){
      const card = document.createElement('div'); card.className='day';
      card.innerHTML = `
        <div class="tag"><span class="dot" style="background:${p.color}"></span><strong>${p.name}</strong></div>
        <div class="small muted" style="margin-top:6px">${p.id}</div>
        <div class="footer" style="margin-top:auto"><button class="btn" data-delp="${p.id}">Delete</button></div>
      `;
      projList.appendChild(card);
    }
    projList.querySelectorAll('[data-delp]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-delp');
        db.projects = db.projects.filter(x=> x.id!==id);
        db.entries = db.entries.filter(x=> x.projectId!==id);
        saveDB(); renderProjects(); renderCalendar();
      });
    });
  }
  projAdd.onclick = ()=>{
    const name = (projName.value||'').trim(); if(!name) return;
    const color = projColor.value||'#22c55e';
    db.projects.push({ id:uid('p'), name, color }); saveDB(); projName.value=''; renderProjects();
  };

  // ===== Export / Import =====
  document.getElementById('btnExport').onclick = ()=>{
    const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download='smart-calendar-data.json'; a.click(); URL.revokeObjectURL(url);
  };
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const reader = new FileReader(); reader.onload = ()=>{
      try{ db = JSON.parse(String(reader.result)); saveDB(); renderCalendar(); renderTotals(); renderProjects(); }
      catch{ alert('Invalid JSON'); }
    }; reader.readAsText(f);
  });

  // ===== Init =====
  if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js')); }
  renderCalendar();

  </script>
</body>
</html>
