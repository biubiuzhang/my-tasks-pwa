<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WPA – Two‑Week Work Planner</title>
  <style>
    :root{
      --bg:#0b0d12;          /* page background */
      --card:#12151c;        /* cards */
      --muted:#a9b0c0;       /* secondary text */
      --text:#e6eaf3;        /* primary text */
      --accent:#27c77d;      /* accent */
      --grid:#1e2430;        /* grid borders */
      --pill-bg: #1b2130;    /* task pill bg */
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
    }
    html,body{height:100%}
    body{margin:0;font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji","Segoe UI Emoji"; background:var(--bg); color:var(--text);}
    .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .title{font-weight:700;font-size:22px}
    .btn{appearance:none;border:1px solid var(--grid);background:var(--card);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer}
    .btn:hover{border-color:#2a3345}
    .ghost{background:transparent}
    .chip{border:1px solid var(--grid);background:var(--pill-bg);padding:6px 10px;border-radius:999px;color:var(--muted);font-size:12px}

    /* Summary strip */
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
    .card{background:var(--card);border:1px solid var(--grid);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
    .k{font-size:12px;color:var(--muted);margin-bottom:4px}
    .v{font-size:22px;font-weight:700}

    /* Calendar grid */
    .calendar{background:var(--card);border:1px solid var(--grid);border-radius:var(--radius);overflow:hidden}
    .head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--grid);}
    .head div{padding:10px 12px;font-size:12px;color:var(--muted);text-align:center}
    .grid{display:grid;grid-template-columns:repeat(7,1fr);min-height:360px}

    .day{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:10px 10px 12px 10px;position:relative;cursor:pointer}
    .day:nth-child(7n){border-right:0}
    .date{font-weight:700;font-size:13px}
    .total{position:absolute;top:10px;right:10px;font-size:12px;color:var(--muted)}
    .bars{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px}
    .pill{display:flex;align-items:center;gap:6px;background:var(--pill-bg);border-radius:999px;border:1px solid var(--grid);padding:4px 8px;font-size:12px}
    .dot{width:8px;height:8px;border-radius:50%}
    .more{color:var(--muted)}
    .empty{opacity:.4}
    .today{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}

    /* Legend */
    .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .legend .pill{padding:6px 10px}

    /* Drawer (native dialog) */
    dialog::backdrop{background:rgba(0,0,0,.55)}
    dialog{border:0;border-radius:20px;max-width:640px;width:92vw;background:var(--card);color:var(--text);box-shadow:var(--shadow)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--grid)}
    .drawer-body{padding:8px 16px 16px 16px}
    .task-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--grid);padding:12px 0}
    .task-row:last-child{border-bottom:0}
    .left{display:flex;gap:10px;align-items:center}
    .money{font-weight:700}

    /* Responsive */
    @media (max-width:720px){
      .summary{grid-template-columns:repeat(2,1fr)}
      .date{font-size:12px}
      .pill{font-size:11px}
      .bars{gap:4px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:space-between">
      <div class="title">WPA · Two‑Week View</div>
      <div class="row">
        <button class="btn ghost" id="btnPrev">◀︎ Prev 2 weeks</button>
        <button class="btn" id="btnToday">Today</button>
        <button class="btn ghost" id="btnNext">Next 2 weeks ▶︎</button>
      </div>
    </div>

    <div class="summary">
      <div class="card"><div class="k">Total Hours</div><div class="v" id="sumHours">0 h</div></div>
      <div class="card"><div class="k">Income</div><div class="v" id="sumIncome">¥0</div></div>
      <div class="card"><div class="k">Days Worked</div><div class="v" id="sumDays">0</div></div>
      <div class="card"><div class="k">Period</div><div class="v" id="sumRange">—</div></div>
    </div>

    <div class="calendar card">
      <div class="head" id="weekdayHead"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="legend" id="legend"></div>
  </div>

  <!-- Drawer for day details -->
  <dialog id="drawer">
    <div class="drawer-head">
      <div>
        <div class="k">Selected Day</div>
        <div class="v" id="drawerDate">—</div>
      </div>
      <button class="btn" onclick="drawer.close()">Close</button>
    </div>
    <div class="drawer-body">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="chip">Total Hours: <span id="drawerHours">0</span></div>
        <div class="chip">Income: <span id="drawerIncome">¥0</span></div>
      </div>
      <div id="taskList"></div>
    </div>
  </dialog>

<script>
/* =====================
   Data & Utilities
===================== */
const CURRENCY = '¥'; // change to '$' if needed

// Demo dataset — replace/extend with your real persistence later
const demoData = {
  "2025-10-07": {
    tasks: [
      { title: "Main Shift", hours: 6 + 10/60, rate: 100.0, note: "正班 6h10m × 测试长岗常常哈哈斤斤计较", pay: 616.67 },
      { title: "Testing", hours: 3.0, rate: 10.0, note: "额外测试", pay: 30 }
    ]
  },
  "2025-10-01": { tasks: [{ title: "Holiday Support", hours: 2.5, rate: 120 }] },
  "2025-10-05": { tasks: [{ title: "Meeting", hours: 1.2, rate: 0, note: "unpaid" }] },
  "2025-10-10": { tasks: [{ title: "Client A", hours: 4, rate: 120 }, { title: "Admin", hours: .8, rate: 0 }] },
  "2025-10-18": { tasks: [{ title: "Client B", hours: 7.3, rate: 110 }] }
};

// Try to read from localStorage; if missing, seed with demo
const DB_KEY = 'wpa_data_v1';
let db = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
if(!db){ db = demoData; localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function fmtMoney(n){ return CURRENCY + (n||0).toFixed(2); }
function fmtHours(h){ return (h||0).toFixed(1) + ' h'; }
function ymd(d){ return d.toISOString().slice(0,10); }

// Deterministic color from string
function colorFromString(s){
  let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))>>>0; }
  h = h % 360; const sat = 65, light = 55; return `hsl(${h} ${sat}% ${light}%)`;
}

/* =====================
   Calendar Logic
===================== */
const gridEl = document.getElementById('grid');
const legendEl = document.getElementById('legend');
const headEl = document.getElementById('weekdayHead');
const sumHoursEl = document.getElementById('sumHours');
const sumIncomeEl = document.getElementById('sumIncome');
const sumDaysEl = document.getElementById('sumDays');
const sumRangeEl = document.getElementById('sumRange');

const drawer = document.getElementById('drawer');
const drawerDateEl = document.getElementById('drawerDate');
const drawerHoursEl = document.getElementById('drawerHours');
const drawerIncomeEl = document.getElementById('drawerIncome');
const taskListEl = document.getElementById('taskList');

let anchor = new Date();

// Weekday header
const weekdayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
headEl.innerHTML = weekdayNames.map(w=>`<div>${w}</div>`).join('');

function startOfWeek(d){
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  let day = x.getUTCDay(); // 0..6 (Sun..Sat)
  day = (day === 0 ? 7 : day); // convert Sun->7
  x.setUTCDate(x.getUTCDate() - (day-1)); // move to Monday
  return new Date(x);
}

function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }

function computeTotals(tasks){
  let hours=0, income=0; const byType = new Map();
  (tasks||[]).forEach(t=>{
    hours += t.hours || 0;
    const pay = (t.pay != null) ? t.pay : (t.rate||0) * (t.hours||0);
    income += pay;
    const key = t.title || 'Task';
    const prev = byType.get(key) || {hours:0, income:0, color:colorFromString(key)};
    prev.hours += (t.hours||0); prev.income += pay; byType.set(key, prev);
  });
  return {hours, income, byType};
}

function render(){
  // determine 14-day window starting from Monday of the week that holds anchor
  const start = startOfWeek(anchor);
  const end = addDays(start, 13);
  sumRangeEl.textContent = `${start.toISOString().slice(0,10)} → ${end.toISOString().slice(0,10)}`;

  // Collect legend during render
  const legendTypes = new Map();

  // Period totals
  let pHours=0, pIncome=0, pDays=0;

  gridEl.innerHTML = '';
  for(let i=0;i<14;i++){
    const d = addDays(start, i);
    const key = ymd(d);
    const entry = db[key];
    const {hours, income, byType} = computeTotals(entry?.tasks || []);
    if(hours>0){ pHours += hours; pIncome += income; pDays++; }

    // day cell
    const dayDiv = document.createElement('div');
    dayDiv.className = 'day' + (ymd(new Date())===key ? ' today' : '') + (!entry?' empty':'');
    dayDiv.dataset.date = key;

    const date = document.createElement('div'); date.className='date'; date.textContent = new Date(key+'T00:00:00').getDate();
    const total = document.createElement('div'); total.className='total'; total.textContent = hours?fmtHours(hours):'—';

    const bars = document.createElement('div'); bars.className='bars';

    // Make pill tags for up to 3 task types, showing hours
    const types = [...byType.entries()].sort((a,b)=>b[1].hours - a[1].hours);
    types.slice(0,3).forEach(([name, info])=>{
      const pill = document.createElement('div'); pill.className='pill';
      const dot = document.createElement('span'); dot.className='dot'; dot.style.background = info.color; pill.appendChild(dot);
      const text = document.createElement('span'); text.textContent = `${(info.hours).toFixed(1)}h`; pill.appendChild(text);
      bars.appendChild(pill);
      if(!legendTypes.has(name)) legendTypes.set(name, info.color);
    });
    if(types.length>3){
      const more = document.createElement('div'); more.className='pill more'; more.textContent = `+${types.length-3}`; bars.appendChild(more);
    }

    dayDiv.appendChild(date); dayDiv.appendChild(total); dayDiv.appendChild(bars);

    dayDiv.addEventListener('click',()=>openDrawerForDate(key));
    gridEl.appendChild(dayDiv);
  }

  // Update summary
  sumHoursEl.textContent = fmtHours(pHours);
  sumIncomeEl.textContent = fmtMoney(pIncome);
  sumDaysEl.textContent = pDays;

  // Legend
  legendEl.innerHTML = '';
  for(const [name, color] of legendTypes.entries()){
    const pill = document.createElement('div'); pill.className='pill';
    const dot = document.createElement('span'); dot.className='dot'; dot.style.background=color; pill.appendChild(dot);
    const label = document.createElement('span'); label.textContent = name; pill.appendChild(label);
    legendEl.appendChild(pill);
  }
}

function openDrawerForDate(key){
  const entry = db[key] || {tasks:[]};
  const {hours, income} = computeTotals(entry.tasks);
  drawerDateEl.textContent = key;
  drawerHoursEl.textContent = fmtHours(hours);
  drawerIncomeEl.textContent = fmtMoney(income);
  taskListEl.innerHTML = '';

  if(entry.tasks.length===0){
    taskListEl.innerHTML = `<div class="chip">No tasks for this day.</div>`;
  } else {
    entry.tasks.forEach(t=>{
      const row = document.createElement('div'); row.className='task-row';
      const left = document.createElement('div'); left.className='left';
      const dot = document.createElement('span'); dot.className='dot'; dot.style.background = colorFromString(t.title||'Task'); left.appendChild(dot);
      const title = document.createElement('div'); title.innerHTML = `<strong>${t.title||'Task'}</strong><div class="k">${t.note||''}</div>`; left.appendChild(title);
      const right = document.createElement('div');
      const pay = (t.pay != null) ? t.pay : (t.rate||0) * (t.hours||0);
      right.innerHTML = `<div class="money">${fmtMoney(pay)}</div><div class="k" style="text-align:right">${(t.hours||0).toFixed(2)} h @ ${fmtMoney(t.rate||0)}/h</div>`;
      row.appendChild(left); row.appendChild(right);
      taskListEl.appendChild(row);
    });
  }
  drawer.showModal();
}

// Navigation handlers
 document.getElementById('btnPrev').onclick = ()=>{ anchor = addDays(startOfWeek(anchor), -14); render(); };
 document.getElementById('btnNext').onclick = ()=>{ anchor = addDays(startOfWeek(anchor), 14); render(); };
 document.getElementById('btnToday').onclick = ()=>{ anchor = new Date(); render(); };

render();
</script>
</body>
</html>
