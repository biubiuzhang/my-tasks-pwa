name: ping
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Show context
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "event=$GITHUB_EVENT_NAME"
      - name: Checkout
        uses: actions/checkout@v4
      - name: List files
        run: ls -la
